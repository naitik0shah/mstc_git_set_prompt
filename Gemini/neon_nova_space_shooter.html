<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON NOVA - Arcade Space Shooter</title>
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --accent: #ffe600;
            --success: #00ff66;
            --dark-bg: #05050d;
            --panel-bg: rgba(12, 12, 30, 0.75);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: var(--font-family);
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a0a24 0%, #020208 100%);
        }

        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            background: transparent;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .hud-box {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 10px 18px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a99ad;
            margin-bottom: 3px;
        }

        .value {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        #score-val { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        #highscore-val { color: var(--accent); }
        #level-val { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }

        .health-container {
            width: 180px;
        }

        .health-bar-outer {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 4px;
        }

        .health-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #00ff66);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 8px #00ff66;
        }

        /* Powerups HUD Indicators */
        #powerup-indicators {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .powerup-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #fff;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 4, 12, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary), #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #9aa8c0;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 127, 0.2));
            border: 2px solid var(--primary);
            color: #fff;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            text-transform: uppercase;
            margin: 8px;
            pointer-events: auto;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.4), rgba(255, 0, 127, 0.4));
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Top Bar Controls */
        .top-controls {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .dpad, .fire-zone {
            pointer-events: auto;
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 240, 255, 0.4);
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            active-bg: rgba(0, 240, 255, 0.4);
        }

        .touch-btn:active {
            background: rgba(0, 240, 255, 0.4);
            transform: scale(0.95);
        }

        .touch-btn-fire {
            width: 75px;
            height: 75px;
            border-color: rgba(255, 0, 127, 0.5);
            background: rgba(255, 0, 127, 0.15);
        }

        .touch-btn-fire:active {
            background: rgba(255, 0, 127, 0.5);
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            .title-logo { font-size: 32px; }
            .hud-box { padding: 6px 10px; }
            .value { font-size: 16px; }
            .health-container { width: 110px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Game Render Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- UI HUD Layer Overlay -->
        <div id="ui-layer">
            <div class="hud-header">
                <div class="hud-box">
                    <div class="label">SCORE</div>
                    <div id="score-val" class="value">0</div>
                </div>

                <div class="hud-box">
                    <div class="label">HIGH SCORE</div>
                    <div id="highscore-val" class="value">0</div>
                </div>

                <div class="hud-box">
                    <div class="label">LEVEL</div>
                    <div id="level-val" class="value">1</div>
                </div>

                <div class="hud-box health-container">
                    <div class="label">SHIELD HEALTH</div>
                    <div class="health-bar-outer">
                        <div id="health-bar" class="health-bar-inner"></div>
                    </div>
                </div>

                <div class="top-controls">
                    <button id="pause-btn" class="icon-btn" title="Pause Game">⏸</button>
                    <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊</button>
                </div>
            </div>

            <div id="powerup-indicators"></div>
        </div>

        <!-- Touch Controls for Mobile Devices -->
        <div id="mobile-controls">
            <div class="dpad">
                <div id="btn-left" class="touch-btn">◀</div>
                <div id="btn-right" class="touch-btn">▶</div>
            </div>
            <div class="fire-zone">
                <div id="btn-fire" class="touch-btn touch-btn-fire">🔥</div>
            </div>
        </div>

        <!-- Start Screen Modal -->
        <div id="start-screen" class="overlay-screen">
            <h1 class="title-logo">NEON NOVA</h1>
            <div class="subtitle">Arcade Space Shooter</div>
            <p style="color: #8a99ad; margin-bottom: 20px; text-align: center; max-width: 300px; font-size: 13px; line-height: 1.5;">
                Controls: <b>[A/D]</b> or <b>[Left/Right Arrows]</b> to Move.<br>
                <b>[SPACEBAR]</b> to Shoot Lasers.
            </p>
            <button id="start-btn" class="btn">LAUNCH MISSION</button>
        </div>

        <!-- Pause Screen Modal -->
        <div id="pause-screen" class="overlay-screen hidden">
            <h1 class="title-logo" style="font-size: 36px;">GAME PAUSED</h1>
            <button id="resume-btn" class="btn">RESUME</button>
            <button id="restart-pause-btn" class="btn" style="border-color: #8a99ad; font-size: 14px;">RESTART</button>
        </div>

        <!-- Game Over Screen Modal -->
        <div id="gameover-screen" class="overlay-screen hidden">
            <h1 class="title-logo" style="color: var(--secondary); text-shadow: 0 0 30px var(--secondary);">MISSION FAILED</h1>
            <div class="subtitle">YOUR SHIP WAS DESTROYED</div>
            <div style="margin-bottom: 25px; text-align: center;">
                <div class="label">FINAL SCORE</div>
                <div id="final-score" class="value" style="font-size: 36px; color: var(--primary);">0</div>
            </div>
            <button id="restart-btn" class="btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        /**
         * Sound Effects Synthesizer using Web Audio API (Zero External Assets)
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playLaser() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }

            playExplosion(isLarge = false) {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const duration = isLarge ? 0.5 : 0.25;

                // Create Noise Buffer
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isLarge ? 400 : 800, now);
                filter.frequency.exponentialRampToValueAtTime(30, now + duration);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(isLarge ? 0.4 : 0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playPowerup() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                osc.frequency.linearRampToValueAtTime(900, now + 0.2);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playHit() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        const sfx = new SoundFX();

        class Starfield {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.stars = [];
                this.init();
            }

            init() {
                this.stars = [];
                const count = Math.floor((this.canvas.width * this.canvas.height) / 3000);
                for (let i = 0; i < count; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 2 + 0.5,
                        speed: Math.random() * 1.5 + 0.5,
                        alpha: Math.random() * 0.8 + 0.2
                    });
                }
            }

            update(dt) {
                this.stars.forEach(star => {
                    star.y += star.speed * 60 * dt;
                    if (star.y > this.canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * this.canvas.width;
                    }
                });
            }

            draw() {
                this.ctx.save();
                this.stars.forEach(star => {
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                this.ctx.restore();
            }
        }

        class Player {
            constructor(canvas) {
                this.canvas = canvas;
                this.width = 44;
                this.height = 48;
                this.x = canvas.width / 2;
                this.y = canvas.height - 80;
                this.speed = 420; // px per second
                this.hp = 100;
                this.maxHp = 100;
                this.shootTimer = 0;
                this.shootInterval = 0.18; // Seconds per shot
                this.powerups = {
                    rapidFire: 0,
                    shield: 0,
                    doubleScore: 0
                };
            }

            update(dt, keys, bullets) {
                // Movement
                let dx = 0;
                if (keys.left) dx -= 1;
                if (keys.right) dx += 1;

                this.x += dx * this.speed * dt;
                // Clamp within screen boundaries
                this.x = Math.max(this.width / 2, Math.min(this.canvas.width - this.width / 2, this.x));

                // Active Powerup Timers
                for (let key in this.powerups) {
                    if (this.powerups[key] > 0) {
                        this.powerups[key] -= dt;
                    }
                }

                // Shooting Logic
                this.shootTimer -= dt;
                const currentInterval = this.powerups.rapidFire > 0 ? this.shootInterval / 2.5 : this.shootInterval;

                if (keys.shoot && this.shootTimer <= 0) {
                    this.shoot(bullets);
                    this.shootTimer = currentInterval;
                }
            }

            shoot(bullets) {
                sfx.playLaser();
                if (this.powerups.rapidFire > 0) {
                    // Twin Lasers
                    bullets.push(new Bullet(this.x - 12, this.y - 10, -10));
                    bullets.push(new Bullet(this.x + 12, this.y - 10, 10));
                } else {
                    // Single Center Laser
                    bullets.push(new Bullet(this.x, this.y - 20, 0));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Shield visual effect
                if (this.powerups.shield > 0) {
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(0, 0, 32, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Player Spaceship Body (Vector Drawn Arcady Ship)
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(10, this.height / 4);
                ctx.lineTo(-10, this.height / 4);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();

                // Thruster Glow Animation
                ctx.fillStyle = '#ff007f';
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(-8, this.height / 4 + 2);
                ctx.lineTo(0, this.height / 2 + Math.random() * 12 + 6);
                ctx.lineTo(8, this.height / 4 + 2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, offsetX = 0) {
                this.x = x + offsetX;
                this.y = y;
                this.radius = 4;
                this.speed = 700;
                this.markedForDeletion = false;
            }

            update(dt) {
                this.y -= this.speed * dt;
                if (this.y < -10) this.markedForDeletion = true;
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = '#ffe600';
                ctx.shadowColor = '#ffe600';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(canvas, type) {
                this.canvas = canvas;
                this.type = type; // 'scout', 'cruiser', 'dreadnought'
                this.markedForDeletion = false;

                if (type === 'scout') {
                    this.width = 28;
                    this.height = 28;
                    this.speed = 220 + Math.random() * 60;
                    this.hp = 1;
                    this.maxHp = 1;
                    this.scoreValue = 100;
                    this.color = '#ff007f';
                } else if (type === 'cruiser') {
                    this.width = 42;
                    this.height = 42;
                    this.speed = 140 + Math.random() * 40;
                    this.hp = 3;
                    this.maxHp = 3;
                    this.scoreValue = 250;
                    this.color = '#ffe600';
                } else { // dreadnought
                    this.width = 64;
                    this.height = 60;
                    this.speed = 80 + Math.random() * 30;
                    this.hp = 7;
                    this.maxHp = 7;
                    this.scoreValue = 600;
                    this.color = '#b000ff';
                }

                this.x = Math.random() * (canvas.width - this.width) + this.width / 2;
                this.y = -this.height;
            }

            update(dt) {
                this.y += this.speed * dt;
                if (this.y > this.canvas.height + this.height) {
                    this.markedForDeletion = true;
                    return true; // Reached bottom
                }
                return false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                if (this.type === 'scout') {
                    // Triangle Down
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                } else if (this.type === 'cruiser') {
                    // Diamond
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(this.width / 2, 0);
                    ctx.lineTo(0, -this.height / 2);
                    ctx.lineTo(-this.width / 2, 0);
                } else {
                    // Heavy Hexagon
                    ctx.moveTo(-this.width / 4, -this.height / 2);
                    ctx.lineTo(this.width / 4, -this.height / 2);
                    ctx.lineTo(this.width / 2, 0);
                    ctx.lineTo(this.width / 4, this.height / 2);
                    ctx.lineTo(-this.width / 4, this.height / 2);
                    ctx.lineTo(-this.width / 2, 0);
                }
                ctx.closePath();
                ctx.fill();

                // Draw Mini HP bar for damaged tankier enemies
                if (this.hp < this.maxHp) {
                    const barW = this.width;
                    const barH = 4;
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(-barW / 2, -this.height / 2 - 8, barW, barH);
                    ctx.fillStyle = '#00ff66';
                    ctx.fillRect(-barW / 2, -this.height / 2 - 8, barW * (this.hp / this.maxHp), barH);
                }

                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.speed = 120;
                this.markedForDeletion = false;

                const types = ['rapidFire', 'shield', 'doubleScore'];
                this.type = types[Math.floor(Math.random() * types.length)];

                if (this.type === 'rapidFire') { this.color = '#ffe600'; this.label = 'F'; }
                else if (this.type === 'shield') { this.color = '#00f0ff'; this.label = 'S'; }
                else { this.color = '#00ff66'; this.label = '2X'; }
            }

            update(dt) {
                this.y += this.speed * dt;
                if (this.y > window.innerHeight + 20) this.markedForDeletion = true;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.label, 0, 1);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 180 + 20;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 1.5 + 1.2; // fade per second
                this.markedForDeletion = false;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= this.decay * dt;
                if (this.alpha <= 0) this.markedForDeletion = true;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.starfield = new Starfield(this.canvas);
                this.player = new Player(this.canvas);

                this.bullets = [];
                this.enemies = [];
                this.powerups = [];
                this.particles = [];

                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('nn_highscore') || '0', 10);
                this.level = 1;
                this.spawnTimer = 0;
                this.spawnInterval = 1.4; // Seconds between spawns

                this.keys = { left: false, right: false, shoot: false };
                this.gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER

                this.lastTime = 0;
                this.setupInputs();
                this.updateUI();
            }

            resize() {
                this.canvas.width = Math.min(window.innerWidth, 800);
                this.canvas.height = window.innerHeight;
                if (this.starfield) this.starfield.init();
            }

            setupInputs() {
                // Keyboard Listeners
                window.addEventListener('keydown', e => {
                    if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true;
                    if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true;
                    if (e.code === 'Space') this.keys.shoot = true;
                    if (e.code === 'KeyP') this.togglePause();
                });

                window.addEventListener('keyup', e => {
                    if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false;
                    if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false;
                    if (e.code === 'Space') this.keys.shoot = false;
                });

                // Touch Controls for Mobile
                const bindTouch = (id, key) => {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[key] = true; });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[key] = false; });
                };

                bindTouch('btn-left', 'left');
                bindTouch('btn-right', 'right');
                bindTouch('btn-fire', 'shoot');

                // UI Button Triggers
                document.getElementById('start-btn').addEventListener('click', () => this.start());
                document.getElementById('restart-btn').addEventListener('click', () => this.start());
                document.getElementById('restart-pause-btn').addEventListener('click', () => this.start());
                document.getElementById('resume-btn').addEventListener('click', () => this.togglePause());
                document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());

                const soundBtn = document.getElementById('sound-btn');
                soundBtn.addEventListener('click', () => {
                    sfx.enabled = !sfx.enabled;
                    soundBtn.textContent = sfx.enabled ? '🔊' : '🔇';
                });
            }

            start() {
                sfx.init();
                this.player = new Player(this.canvas);
                this.bullets = [];
                this.enemies = [];
                this.powerups = [];
                this.particles = [];
                this.score = 0;
                this.level = 1;
                this.spawnInterval = 1.4;
                this.gameState = 'PLAYING';

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('pause-screen').classList.add('hidden');
                document.getElementById('gameover-screen').classList.add('hidden');

                this.updateUI();
            }

            togglePause() {
                if (this.gameState === 'PLAYING') {
                    this.gameState = 'PAUSED';
                    document.getElementById('pause-screen').classList.remove('hidden');
                } else if (this.gameState === 'PAUSED') {
                    this.gameState = 'PLAYING';
                    document.getElementById('pause-screen').classList.add('hidden');
                }
            }

            gameOver() {
                this.gameState = 'GAMEOVER';
                sfx.playExplosion(true);
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('nn_highscore', this.highScore.toString());
                }
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('gameover-screen').classList.remove('hidden');
                this.updateUI();
            }

            spawnEnemies(dt) {
                this.spawnTimer += dt;
                if (this.spawnTimer >= this.spawnInterval) {
                    this.spawnTimer = 0;

                    // Enemy Type Probability based on Level
                    const rand = Math.random();
                    let type = 'scout';
                    if (this.level >= 2 && rand > 0.6) type = 'cruiser';
                    if (this.level >= 4 && rand > 0.85) type = 'dreadnought';

                    this.enemies.push(new Enemy(this.canvas, type));
                }
            }

            createExplosion(x, y, color, count = 15) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            checkCollisions() {
                // Bullets vs Enemies
                this.bullets.forEach(bullet => {
                    this.enemies.forEach(enemy => {
                        if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                            const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                            if (dist < bullet.radius + enemy.width / 2) {
                                bullet.markedForDeletion = true;
                                enemy.hp--;
                                sfx.playHit();
                                this.createExplosion(bullet.x, bullet.y, '#ffe600', 4);

                                if (enemy.hp <= 0) {
                                    enemy.markedForDeletion = true;
                                    sfx.playExplosion();
                                    this.createExplosion(enemy.x, enemy.y, enemy.color, 18);

                                    // Score Handling
                                    const multiplier = this.player.powerups.doubleScore > 0 ? 2 : 1;
                                    this.score += enemy.scoreValue * multiplier;

                                    // Level Escalation
                                    this.level = Math.floor(this.score / 2000) + 1;
                                    this.spawnInterval = Math.max(0.4, 1.4 - (this.level - 1) * 0.12);

                                    // Chance to Drop PowerUp
                                    if (Math.random() < 0.20) {
                                        this.powerups.push(new PowerUp(enemy.x, enemy.y));
                                    }

                                    this.updateUI();
                                }
                            }
                        }
                    });
                });

                // Player vs Enemies
                this.enemies.forEach(enemy => {
                    if (!enemy.markedForDeletion) {
                        const dist = Math.hypot(this.player.x - enemy.x, this.player.y - enemy.y);
                        if (dist < (this.player.width / 2 + enemy.width / 2)) {
                            enemy.markedForDeletion = true;
                            this.createExplosion(enemy.x, enemy.y, enemy.color, 15);

                            if (this.player.powerups.shield > 0) {
                                this.player.powerups.shield = 0; // Shield absorbs hit
                                sfx.playHit();
                            } else {
                                this.player.hp -= 25;
                                sfx.playExplosion();
                                if (this.player.hp <= 0) {
                                    this.player.hp = 0;
                                    this.gameOver();
                                }
                            }
                            this.updateUI();
                        }
                    }
                });

                // Player vs Powerups
                this.powerups.forEach(p => {
                    if (!p.markedForDeletion) {
                        const dist = Math.hypot(this.player.x - p.x, this.player.y - p.y);
                        if (dist < (this.player.width / 2 + p.radius)) {
                            p.markedForDeletion = true;
                            sfx.playPowerup();

                            if (p.type === 'shield') this.player.hp = Math.min(this.player.maxHp, this.player.hp + 30);
                            this.player.powerups[p.type] = 8; // 8 seconds duration
                            this.updateUI();
                        }
                    }
                });
            }

            update(dt) {
                this.starfield.update(dt);

                if (this.gameState !== 'PLAYING') return;

                this.player.update(dt, this.keys, this.bullets);
                this.spawnEnemies(dt);

                // Update Projectiles
                this.bullets.forEach(b => b.update(dt));
                this.bullets = this.bullets.filter(b => !b.markedForDeletion);

                // Update Enemies
                this.enemies.forEach(e => {
                    const reachedBottom = e.update(dt);
                    if (reachedBottom) {
                        // Penalty for leak
                        if (this.player.powerups.shield <= 0) {
                            this.player.hp -= 10;
                            if (this.player.hp <= 0) {
                                this.player.hp = 0;
                                this.gameOver();
                            }
                            this.updateUI();
                        }
                    }
                });
                this.enemies = this.enemies.filter(e => !e.markedForDeletion);

                // Update Drops & Particles
                this.powerups.forEach(p => p.update(dt));
                this.powerups = this.powerups.filter(p => !p.markedForDeletion);

                this.particles.forEach(pt => pt.update(dt));
                this.particles = this.particles.filter(pt => !pt.markedForDeletion);

                this.checkCollisions();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Render Starfield Background
                this.starfield.draw();

                if (this.gameState === 'PLAYING' || this.gameState === 'PAUSED') {
                    // Render Game Entities
                    this.particles.forEach(pt => pt.draw(this.ctx));
                    this.powerups.forEach(p => p.draw(this.ctx));
                    this.bullets.forEach(b => b.draw(this.ctx));
                    this.enemies.forEach(e => e.draw(this.ctx));
                    this.player.draw(this.ctx);
                }
            }

            updateUI() {
                document.getElementById('score-val').textContent = this.score;
                document.getElementById('highscore-val').textContent = this.highScore;
                document.getElementById('level-val').textContent = this.level;

                const healthPct = Math.max(0, (this.player.hp / this.player.maxHp) * 100);
                document.getElementById('health-bar').style.width = healthPct + '%';

                // Powerup Status Badges
                const container = document.getElementById('powerup-indicators');
                container.innerHTML = '';
                for (let key in this.player.powerups) {
                    if (this.player.powerups[key] > 0) {
                        const pill = document.createElement('div');
                        pill.className = 'powerup-pill';
                        let label = key === 'rapidFire' ? 'RAPID FIRE' : key === 'shield' ? 'SHIELD' : '2X SCORE';
                        let color = key === 'rapidFire' ? '#ffe600' : key === 'shield' ? '#00f0ff' : '#00ff66';
                        pill.style.borderColor = color;
                        pill.style.color = color;
                        pill.textContent = `${label} (${Math.ceil(this.player.powerups[key])}s)`;
                        container.appendChild(pill);
                    }
                }
            }

            run(timestamp = 0) {
                const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); // Clamp max frame time
                this.lastTime = timestamp;

                this.update(dt);
                this.draw();

                requestAnimationFrame(ts => this.run(ts));
            }
        }

        // Initialize and Start Engine on Load
        window.onload = () => {
            const game = new GameEngine();
            game.run();
        };
    </script>
</body>
