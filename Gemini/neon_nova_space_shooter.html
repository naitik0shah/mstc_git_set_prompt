<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WARP VECTOR: SPACE SHOOTER</title>
    <style>
        :root {
            --bg-dark: #0a0403;
            --warm-gold: #ffb703;
            --warm-orange: #fb8500;
            --warm-coral: #ff5733;
            --warm-red: #d62828;
            --warm-glow: rgba(255, 133, 0, 0.4);
            --grid-color: rgba(255, 183, 3, 0.08);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-family);
            color: #fff;
        }

        /* ------------------ 3D WARM LANDING PAGE ------------------ */
        #landing-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1c0a05 0%, #050201 100%);
            transition: opacity 1s ease, transform 1s ease;
        }

        #landing-page.warp-out {
            opacity: 0;
            transform: scale(3);
            pointer-events: none;
        }

        .hero-container {
            text-align: center;
            transform-style: preserve-3d;
            animation: heroFloat 4s ease-in-out infinite;
        }

        @keyframes heroFloat {
            0%, 100% { transform: translateY(0) rotateX(10deg) rotateY(0deg); }
            50% { transform: translateY(-15px) rotateX(15deg) rotateY(5deg); }
        }

        .landing-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffe066 0%, var(--warm-orange) 50%, var(--warm-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(251, 133, 0, 0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .landing-subtitle {
            font-size: 1.2rem;
            color: var(--warm-gold);
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px var(--warm-glow);
        }

        .glow-btn {
            background: linear-gradient(135deg, var(--warm-orange), var(--warm-red));
            border: 2px solid var(--warm-gold);
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--warm-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .glow-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 133, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, #ff9e00, #e63946);
        }

        .glow-btn:active {
            transform: scale(0.98);
        }

        /* ------------------ GAME WRAPPER ------------------ */
        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #0d0503;
            box-shadow: 0 0 40px rgba(251, 133, 0, 0.15);
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: rgba(20, 8, 4, 0.75);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hud-label {
            font-size: 0.75rem;
            color: var(--warm-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 8px var(--warm-orange);
        }

        .health-bar-bg {
            width: 140px;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid rgba(255, 183, 3, 0.4);
        }

        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--warm-red), var(--warm-orange), var(--warm-gold));
            transition: width 0.2s ease;
            box-shadow: 0 0 10px var(--warm-orange);
        }

        /* Top Menu Control Bar */
        #top-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 15;
        }

        .icon-btn {
            background: rgba(25, 10, 5, 0.85);
            border: 1px solid var(--warm-gold);
            color: var(--warm-gold);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .icon-btn:hover {
            background: var(--warm-orange);
            color: #000;
            box-shadow: 0 0 12px var(--warm-orange);
        }

        /* Overlay Screens (Pause / Game Over) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 4, 3, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--warm-gold);
            text-shadow: 0 0 20px var(--warm-orange);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .modal-score-box {
            background: rgba(30, 12, 6, 0.8);
            border: 1px solid var(--warm-orange);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        /* Touch / Mobile Controls */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
            z-index: 12;
        }

        .touch-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 133, 0, 0.25);
            border: 2px solid var(--warm-gold);
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(255, 133, 0, 0.6);
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            #touch-controls { display: flex; }
            .hud-card { padding: 6px 12px; }
            .hud-value { font-size: 1.1rem; }
            .landing-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- 3D LANDING / HOME PAGE -->
    <div id="landing-page">
        <div class="hero-container">
            <h1 class="landing-title">WARP VECTOR</h1>
            <p class="landing-subtitle">WARM TONE TACTICAL SPACE SHOOTER</p>
            <button class="glow-btn" id="start-flight-btn">ENTER GAME</button>
        </div>
    </div>

    <!-- MAIN GAME WRAPPER -->
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- TOP BAR NAVIGATION CONTROLS -->
        <div id="top-controls">
            <button class="icon-btn" id="btn-home">HOME</button>
            <button class="icon-btn" id="btn-pause">PAUSE</button>
            <button class="icon-btn" id="btn-restart">RESTART</button>
        </div>

        <!-- HUD OVERLAY -->
        <div id="hud">
            <div class="hud-card">
                <div class="hud-label">Health</div>
                <div class="health-bar-bg">
                    <div id="health-fill" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Score</div>
                <div id="score-val" class="hud-value">0000</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">High Score</div>
                <div id="high-score-val" class="hud-value">0000</div>
            </div>
            <div class="hud-card">
                <div class="hud-label">Level</div>
                <div id="level-val" class="hud-value">1</div>
            </div>
        </div>

        <!-- PAUSE MODAL -->
        <div class="modal-overlay" id="pause-modal">
            <h2 class="modal-title">GAME PAUSED</h2>
            <div class="btn-group">
                <button class="glow-btn" id="resume-btn">RESUME</button>
            </div>
        </div>

        <!-- GAME OVER MODAL -->
        <div class="modal-overlay" id="gameover-modal">
            <h2 class="modal-title">MISSION FAILED</h2>
            <div class="modal-score-box">
                <p style="color:var(--warm-gold); letter-spacing: 2px;">FINAL SCORE</p>
                <h3 id="final-score" style="font-size: 3rem; color:#fff;">0</h3>
            </div>
            <div class="btn-group">
                <button class="glow-btn" id="restart-modal-btn">PLAY AGAIN</button>
            </div>
        </div>

        <!-- TOUCH CONTROLS -->
        <div id="touch-controls">
            <div style="display:flex; gap:15px;">
                <div class="touch-btn" id="touch-left">◄</div>
                <div class="touch-btn" id="touch-right">►</div>
            </div>
            <div class="touch-btn" id="touch-shoot" style="background:rgba(214,40,40,0.4); border-color:var(--warm-coral);">🔥</div>
        </div>
    </div>

    <script>
        /**
         * WARP VECTOR - SINGLE FILE GAME ENGINE
         * Clean State Logic & Sound Synthesizer
         */

        // GAME STATES
        const STATE = { LANDING: 'LANDING', PLAYING: 'PLAYING', PAUSED: 'PAUSED', GAMEOVER: 'GAMEOVER' };
        let currentState = STATE.LANDING;

        // CANVAS & RESIZING
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = Math.min(window.innerWidth, 1000);
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // SOUND SYNTHESIZER (Web Audio API)
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playLaser() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playExplosion() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playPowerup() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }
        const sfx = new SoundFX();

        // INPUT ENGINE
        const keys = { left: false, right: false, shoot: false };
        const mouse = { x: width / 2, y: height / 2, angle: -Math.PI / 2 };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') {
                // Prevent scrolling & space key glitching
                e.preventDefault();
                if (currentState === STATE.PLAYING && !keys.shoot) {
                    keys.shoot = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space') keys.shoot = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0 && currentState === STATE.PLAYING) {
                keys.shoot = true;
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) keys.shoot = false;
        });

        // Touch Listeners
        const setupTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        };
        setupTouch('touch-left', 'left');
        setupTouch('touch-right', 'right');
        setupTouch('touch-shoot', 'shoot');

        // GAME VARIABLES
        let score = 0;
        let highScore = localStorage.getItem('warp_vector_highscore') || 0;
        let level = 1;
        let health = 100;
        let lastShootTime = 0;
        let spawnTimer = 0;

        document.getElementById('high-score-val').innerText = highScore;

        // PLAYER OBJECT
        const player = {
            x: width / 2,
            y: height - 80,
            radius: 22,
            speed: 7,
            angle: -Math.PI / 2,
            rapidFire: 0,
            doubleScore: 0,
            shield: 0
        };

        let bullets = [];
        let enemies = [];
        let powerups = [];
        let particles = [];
        let stars = [];

        // INIT BACKGROUND STARS
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5,
                alpha: Math.random()
            });
        }

        // RESET GAME
        function resetGame() {
            score = 0;
            health = 100;
            level = 1;
            bullets = [];
            enemies = [];
            powerups = [];
            particles = [];
            player.x = width / 2;
            player.rapidFire = 0;
            player.doubleScore = 0;
            player.shield = 0;
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('high-score-val').innerText = highScore;
            document.getElementById('level-val').innerText = level;
            document.getElementById('health-fill').style.width = Math.max(0, health) + '%';
        }

        // SPAWN ENEMIES
        function spawnEnemy() {
            const types = [
                { color: '#ffb703', hp: 1, speed: 2.5, radius: 18, pts: 10 },
                { color: '#fb8500', hp: 2, speed: 2.0, radius: 24, pts: 25 },
                { color: '#d62828', hp: 4, speed: 1.2, radius: 32, pts: 50 }
            ];
            // Higher level introduces stronger enemies
            let available = types.slice(0, Math.min(types.length, Math.floor((level - 1) / 2) + 1));
            let type = available[Math.floor(Math.random() * available.length)];

            enemies.push({
                x: Math.random() * (width - 60) + 30,
                y: -40,
                ...type,
                maxHp: type.hp
            });
        }

        // SPAWN POWERUPS
        function spawnPowerup(x, y) {
            if (Math.random() > 0.25) return; // 25% drop rate
            const pTypes = ['rapid', 'shield', 'double'];
            const chosen = pTypes[Math.floor(Math.random() * pTypes.length)];
            powerups.push({ x, y, type: chosen, radius: 15, vy: 2 });
        }

        // CREATE EXPLOSION PARTICLES
        function createExplosion(x, y, color, count = 15) {
            sfx.playExplosion();
            for (let i = 0; i < count; i++) {
                let ang = Math.random() * Math.PI * 2;
                let spd = Math.random() * 4 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        // MAIN UPDATE LOOP
        function update(dt) {
            if (currentState !== STATE.PLAYING) return;

            // Difficulty Scaling
            level = Math.floor(score / 200) + 1;
            updateHUD();

            // Active Power-up Timers
            if (player.rapidFire > 0) player.rapidFire--;
            if (player.doubleScore > 0) player.doubleScore--;
            if (player.shield > 0) player.shield--;

            // Player Movement
            if (keys.left && player.x - player.radius > 0) player.x -= player.speed;
            if (keys.right && player.x + player.radius < width) player.x += player.speed;

            // Mouse Aim Angle calculation
            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            player.angle = Math.atan2(dy, dx);

            // Shooting Logic
            const fireRate = player.rapidFire > 0 ? 100 : 220; // ms
            const now = Date.now();
            if (keys.shoot && now - lastShootTime > fireRate) {
                sfx.playLaser();
                const speed = 12;
                bullets.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(player.angle) * speed,
                    vy: Math.sin(player.angle) * speed,
                    radius: 4
                });
                lastShootTime = now;
            }

            // Move Bullets
            bullets.forEach((b, i) => {
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    bullets.splice(i, 1);
                }
            });

            // Spawn Enemies
            spawnTimer++;
            const spawnInterval = Math.max(20, 70 - level * 5);
            if (spawnTimer > spawnInterval) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // Update Enemies & Collision
            enemies.forEach((e, ei) => {
                e.y += e.speed + (level * 0.2);

                // Check collision with bottom boundary
                if (e.y - e.radius > height) {
                    enemies.splice(ei, 1);
                    if (player.shield <= 0) {
                        health -= 15;
                        updateHUD();
                        if (health <= 0) triggerGameOver();
                    }
                    return;
                }

                // Check collision with Player
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer < player.radius + e.radius) {
                    createExplosion(e.x, e.y, e.color, 20);
                    enemies.splice(ei, 1);
                    if (player.shield <= 0) {
                        health -= 25;
                        updateHUD();
                        if (health <= 0) triggerGameOver();
                    }
                    return;
                }

                // Check collision with Bullets
                bullets.forEach((b, bi) => {
                    const distToBullet = Math.hypot(b.x - e.x, b.y - e.y);
                    if (distToBullet < b.radius + e.radius) {
                        bullets.splice(bi, 1);
                        e.hp--;
                        createExplosion(b.x, b.y, '#ffb703', 5);

                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color, 20);
                            let earnedPts = e.pts * (player.doubleScore > 0 ? 2 : 1);
                            score += earnedPts;
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('warp_vector_highscore', highScore);
                            }
                            spawnPowerup(e.x, e.y);
                            enemies.splice(ei, 1);
                            updateHUD();
                        }
                    }
                });
            });

            // Update Powerups
            powerups.forEach((p, pi) => {
                p.y += p.vy;
                const dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.radius + p.radius) {
                    sfx.playPowerup();
                    if (p.type === 'rapid') player.rapidFire = 300; // ~5 sec
                    if (p.type === 'shield') player.shield = 300;
                    if (p.type === 'double') player.doubleScore = 300;
                    powerups.splice(pi, 1);
                } else if (p.y > height) {
                    powerups.splice(pi, 1);
                }
            });

            // Update Particles
            particles.forEach((p, pi) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(pi, 1);
            });

            // Update Background Stars
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > height) s.y = 0;
            });
        }

        // RENDER LOOP
        function render() {
            ctx.clearRect(0, 0, width, height);

            // 1. Render Stars
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 200, 150, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Render Tactical Grid Lines
            ctx.strokeStyle = 'rgba(255, 183, 3, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            if (currentState === STATE.PLAYING || currentState === STATE.PAUSED) {
                // 3. Trajectory Path Line
                ctx.strokeStyle = 'rgba(255, 133, 0, 0.25)';
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + Math.cos(player.angle) * 400, player.y + Math.sin(player.angle) * 400);
                ctx.stroke();
                ctx.setLineDash([]);

                // 4. Render Bullets
                bullets.forEach(b => {
                    ctx.fillStyle = '#ffb703';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#fb8500';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // 5. Render Player Spaceship
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle + Math.PI / 2); // Adjust ship nose orientation

                // Shield Glow
                if (player.shield > 0) {
                    ctx.strokeStyle = '#ffb703';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffb703';
                    ctx.beginPath();
                    ctx.arc(0, 0, player.radius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Ship Body
                ctx.fillStyle = '#d62828';
                ctx.strokeStyle = '#ffb703';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -player.radius);
                ctx.lineTo(-player.radius + 5, player.radius);
                ctx.lineTo(0, player.radius - 8);
                ctx.lineTo(player.radius - 5, player.radius);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Thruster Flame
                ctx.fillStyle = '#fb8500';
                ctx.beginPath();
                ctx.moveTo(-6, player.radius - 4);
                ctx.lineTo(0, player.radius + 12 + Math.random() * 6);
                ctx.lineTo(6, player.radius - 4);
                ctx.fill();

                ctx.restore();

                // 6. Render Enemies
                enemies.forEach(e => {
                    ctx.fillStyle = e.color;
                    ctx.strokeStyle = '#ffe066';
                    ctx.lineWidth = 1.5;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = e.color;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    // Enemy Health Ring (for larger enemies)
                    if (e.maxHp > 1) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(e.x, e.y, e.radius + 4, 0, (Math.PI * 2) * (e.hp / e.maxHp));
                        ctx.stroke();
                    }
                });

                // 7. Render Power-ups
                powerups.forEach(p => {
                    ctx.fillStyle = p.type === 'rapid' ? '#ffb703' : p.type === 'shield' ? '#ff5733' : '#fb8500';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.type[0].toUpperCase(), p.x, p.y);
                });

                // 8. Render Particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });
            }

            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            update(16);
            render();
        }

        // STATE TRANSITIONS & EVENT HANDLERS
        function triggerGameOver() {
            currentState = STATE.GAMEOVER;
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-modal').classList.add('active');
        }

        // BUTTON LISTENERS (Clean Single-purpose Binding)
        document.getElementById('start-flight-btn').addEventListener('click', () => {
            sfx.init();
            document.getElementById('landing-page').classList.add('warp-out');
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                resetGame();
                currentState = STATE.PLAYING;
            }, 800);
        });

        document.getElementById('btn-home').addEventListener('click', () => {
            currentState = STATE.LANDING;
            document.getElementById('pause-modal').classList.remove('active');
            document.getElementById('gameover-modal').classList.remove('active');
            const landing = document.getElementById('landing-page');
            landing.style.display = 'flex';
            setTimeout(() => landing.classList.remove('warp-out'), 10);
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            if (currentState === STATE.PLAYING) {
                currentState = STATE.PAUSED;
                document.getElementById('pause-modal').classList.add('active');
            }
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            if (currentState === STATE.PAUSED) {
                currentState = STATE.PLAYING;
                document.getElementById('pause-modal').classList.remove('active');
            }
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            resetGame();
            document.getElementById('pause-modal').classList.remove('active');
            document.getElementById('gameover-modal').classList.remove('active');
            currentState = STATE.PLAYING;
        });

        document.getElementById('restart-modal-btn').addEventListener('click', () => {
            resetGame();
            document.getElementById('gameover-modal').classList.remove('active');
            currentState = STATE.PLAYING;
        });

        // START ENGINE LOOP
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
